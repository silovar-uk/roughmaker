name: Deploy private Roughmaker Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: roughmaker-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      DEPLOY_APPROVED: ${{ secrets.DEPLOY_APPROVED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm run check
      - run: npm test
      - name: Security deployment gate
        id: gate
        run: |
          if [ "$DEPLOY_APPROVED" != 'true' ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Deploy skipped: Cloudflare Access is not approved yet. Set DEPLOY_APPROVED=true only after completing the private-access checklist.'
            exit 0
          fi
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Set Cloudflare D1 binding
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/prepare-deploy.mjs
      - name: Install Wrangler
        if: steps.gate.outputs.ready == 'true'
        run: npm install --no-save wrangler@4
      - name: Apply database migration
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply roughmaker-prod --remote
      - name: Deploy Worker + protected assets
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler deploy
