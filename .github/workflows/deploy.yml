name: Deploy private Roughmaker Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: roughmaker-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      DEPLOY_APPROVED: ${{ secrets.DEPLOY_APPROVED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm run check
      - run: npm test
      - name: Security deployment gate
        run: |
          test "$DEPLOY_APPROVED" = 'true' || (echo 'Deploy is blocked until Access policy is verified and DEPLOY_APPROVED=true.' && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Set Cloudflare D1 binding
        run: node scripts/prepare-deploy.mjs
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Apply database migration
        run: npx wrangler d1 migrations apply roughmaker-prod --remote
      - name: Deploy Worker + protected assets
        run: npx wrangler deploy
